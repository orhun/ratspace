[package]
name = "ratspace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
cosmic-text = "0.19.0"
fux-vt = "0.17.0"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
