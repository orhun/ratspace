[package]
name = "ratspace"
version = "0.1.0"
edition = "2024"

[features]
default = []
tty = [
    "smithay/backend_drm",
    "smithay/backend_udev",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
fux-vt = "0.17.0"
fontdb = "0.16.2"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false }
soft_ratatui = { version = "0.2.0", default-features = false, features = ["cosmic-text"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop"] }
